# =========================================================
# LUDOGAMIF · TU COMPUTADOR (Docker Desktop)
# ---------------------------------------------------------
# Abre http://localhost:8082
#
# Uso:  docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# =========================================================

services:
  app:
    ports:
      - "127.0.0.1:${PUERTO_APP:-8082}:3000"
    environment:
      # En tu PC no hay nginx ni Cloudflare delante.
      TRUST_PROXY: "false"
