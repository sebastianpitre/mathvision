<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <!-- viewport-fit=cover: usa toda la pantalla también en teléfonos con muesca -->
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /*
       * TAMAÑO DE PANTALLA
       * ---------------------------------------------------------
       * Diseño nuevo ("juego", como Free Fire): se usa el ancho real
       * del dispositivo y TODO se mide según el alto de la pantalla
       * (ver .escala-juego en globals.css). Así se ve igual con o sin
       * pantalla completa, en teléfono y en PC (más grande).
       *
       * Pantallas que aún no se rediseñan ("virtual"): en teléfono y
       * tablet en horizontal se dibujan con el ancho de un PC y se
       * reducen. Cuando se rediseñe una pantalla, se agrega su ruta a
       * RUTAS_JUEGO y deja de usar este modo.
       */
      // Pantallas con el diseño nuevo (la ruta exacta o lo que empiece por "ruta/").
      window.RUTAS_JUEGO = [
        "/lobby", "/character", "/tienda", "/profile", "/sala", "/ranking", "/eventos", "/suerte",
        "/games/preguntas", "/games/siglo", "/games/triqui", "/games/escape-algebra", "/triqui-local"
      ];
      window.esRutaJuego = function (ruta) {
        return window.RUTAS_JUEGO.some(function (r) { return ruta === r || ruta.indexOf(r + "/") === 0; });
      };

      (function () {
        var meta = document.getElementById("viewport");
        var ALTO_VIRTUAL = 760;
        var raiz = document.documentElement;
        var modo = window.esRutaJuego(location.pathname) ? "juego" : "virtual";
        var actual = "";

        function ajustar() {
          var tactil = matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;
          var ancho = window.innerWidth, alto = window.innerHeight;
          var contenido = "width=device-width, initial-scale=1.0, viewport-fit=cover";
          var virtual = modo === "virtual" && tactil && ancho > alto && alto > 0;

          if (virtual) {
            var w = Math.round(ALTO_VIRTUAL * (ancho / alto));
            w = Math.max(1240, Math.min(1900, w));
            contenido = "width=" + w + ", viewport-fit=cover";
          }

          raiz.classList.toggle("escala-juego", modo === "juego");
          raiz.classList.toggle("pantalla-virtual", virtual);

          if (contenido !== actual) {
            actual = contenido;
            meta.setAttribute("content", contenido);
          }
        }

        // La app avisa al cambiar de pantalla.
        window.ajustarPantalla = function (nuevo) {
          if (nuevo === modo) return;
          modo = nuevo;
          actual = "";
          ajustar();
        };

        ajustar();
        window.addEventListener("resize", ajustar);
        window.addEventListener("orientationchange", function () { setTimeout(ajustar, 250); });
      })();
    </script>
    <meta name="theme-color" content="#070b14" />
    <!-- Se puede instalar como app: abre en pantalla completa y horizontal -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LudoGamif" />
    <link rel="apple-touch-icon" href="/img/icono-192.png" />
    <title>LudoGamif · Juega y aprende</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
