<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <!-- viewport-fit=cover: usa toda la pantalla también en teléfonos con muesca -->
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /*
       * TELÉFONO Y TABLET EN HORIZONTAL: SE VE COMO EN EL PC, MÁS PEQUEÑO
       * El navegador dibuja el juego con el ancho de un computador
       * (alto "virtual" de ~760 px) y lo reduce para que quepa en la
       * pantalla. Así el diseño es el mismo del PC: letras, íconos y
       * tarjetas se ven proporcionalmente más pequeños.
       * En computador (mouse) no se toca nada.
       */
      (function () {
        var meta = document.getElementById("viewport");
        var ALTO_VIRTUAL = 760;
        var actual = "";

        function ajustar() {
          var tactil = matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;
          var ancho = window.innerWidth, alto = window.innerHeight;
          var contenido = "width=device-width, initial-scale=1.0, viewport-fit=cover";

          // La proporción ancho/alto no cambia con el zoom: sirve para
          // calcular el ancho virtual aunque ya se haya aplicado antes.
          if (tactil && ancho > alto && alto > 0) {
            var virtual = Math.round(ALTO_VIRTUAL * (ancho / alto));
            virtual = Math.max(1240, Math.min(1900, virtual));
            contenido = "width=" + virtual + ", viewport-fit=cover";
          }

          if (contenido !== actual) {
            actual = contenido;
            meta.setAttribute("content", contenido);
          }
        }

        ajustar();
        window.addEventListener("resize", ajustar);
        window.addEventListener("orientationchange", function () { setTimeout(ajustar, 250); });
      })();
    </script>
    <meta name="theme-color" content="#070b14" />
    <!-- Se puede instalar como app: abre en pantalla completa y horizontal -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LudoGamif" />
    <link rel="apple-touch-icon" href="/img/icono-192.png" />
    <title>LudoGamif · Juega y aprende</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
